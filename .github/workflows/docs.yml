# Pushes and pull requests that change only documentation skip the full build
# (build.yml ignores those paths). This keeps the text checks that do not need
# the programs: ASCII punctuation, and the README version against Version.h.
# docs/FINDINGS.md is generated by the program, so its check runs in build.yml
# and again before every release.
name: Docs

on:
  push:
    branches: [ '**' ]
    paths: [ '**.md', 'docs/**', 'LICENSE' ]
  pull_request:
    paths: [ '**.md', 'docs/**', 'LICENSE' ]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  text:
    runs-on: windows-2022
    timeout-minutes: 10
    concurrency:
      group: docs-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: ASCII punctuation in source and docs
        run: python tools/check_punctuation.py

      - name: README version matches Version.h
        run: python tools/check_versions.py --no-exe
